name = "career-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Kept alive on purpose. It is unreachable from Spanish ISPs that block Cloudflare's
# shared range, but it costs nothing and remains a working fallback everywhere else.
workers_dev = true

[[kv_namespaces]]
binding = "CAREER_KV"
id = "729e49d91e014213abeab4004c75c40e"

[vars]
ALLOWED_ORIGIN = "*"

# Custom domain. `*.workers.dev` resolves to a fixed pair of Cloudflare IPs
# (188.114.96.5 / 188.114.97.5) that Spanish ISPs block under anti-piracy court
# orders, which made this API unreachable from Vodafone. A custom domain lands on
# a different, far higher-collateral range instead.
[[routes]]
pattern = "api.sebas1705.dev"
custom_domain = true

# Rate limiting (Workers Rate Limiting binding; no dashboard setup needed, `namespace_id` is just
# a number we pick, unique within the account). Both are keyed by client IP in src/ratelimit.ts.
# Counts are per Cloudflare location and approximate; `period` can only be 10 or 60 seconds.
# Every request to a route that needs a token (writes and /auth/check): 120 per minute. Generous
# enough for a bulk data update script, far below what token guessing needs.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Requests with a missing or wrong token: 10 per minute.
[[ratelimits]]
name = "AUTH_FAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

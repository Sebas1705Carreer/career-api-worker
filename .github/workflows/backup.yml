name: Backup of the live data

# A weekly copy of everything the API holds (GET /all) as a downloadable artifact.
# Reads are public, so no secrets are involved. Restore steps: README, "Backup and restore".

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export /all
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Export /all
        run: node scripts/backup-export.mjs backups/career-all.json

      - name: Upload backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: career-api-backup-${{ github.run_id }}
          path: backups/career-all.json
          retention-days: 30
          if-no-files-found: error
